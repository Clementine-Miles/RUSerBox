[package]
name = "sbm_remote_desktop"
version = "0.1.0"
edition = "2024"
description = "RDP (IronRDP) and VNC client sessions: framebuffer, input, clipboard, certificate pinning"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# Upstream IronRDP's main with ServerBox's few changes (lollipopkit/IronRDP,
# branch `serverbox`), every crate of it: no release to wait for.
ironrdp = { path = "../../third_party/ironrdp/crates/ironrdp", default-features = false, features = ["client", "client-clipboard", "cliprdr", "connector", "core", "displaycontrol", "graphics", "input", "pdu", "rustls-ring", "session"] }
# Its certificate-validation types, which the meta crate does not re-export.
ironrdp-tls = { path = "../../third_party/ironrdp/crates/ironrdp-tls", features = ["rustls-ring"] }
jpeg-decoder = "0.3"
sbm_parser = { path = "../sbm_parser" }
sha2 = "0.11"
smallvec = "1.15"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vnc-rs = "=0.6.0"
x509-cert = { version = "0.3", features = ["std"], default-features = false }
