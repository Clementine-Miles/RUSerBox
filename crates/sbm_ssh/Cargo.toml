[package]
name = "sbm_ssh"
version = "0.1.0"
edition = "2024"
description = "SSH client for the app: connections, host key trust, exec, PTY shells, SFTP and forwards"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
thiserror = "2.0"
log = "0.4"
base64 = "0.22"
sha2 = "0.10"
sbm_parser = { path = "../sbm_parser" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
