[package]
name = "sbm_parser"
version = "0.1.0"
edition = "2024"
description = "Server command manifest, scripts and output parsers (pure, no IO) for the RUSerBox app"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
roxmltree = "0.21"
# Custom commands travel base64-encoded (script::install_custom_cmds_script)
base64 = "0.23"
# The monitor agent's release versions (monitor_agent)
semver = "1.0"

[dev-dependencies]
# .env loading for the opt-in SSH e2e test (tests/ssh_e2e.rs)
dotenvy = "0.15"
# Throwaway directories for the shell tests (tests/files_compat.rs)
tempfile = "3.27.0"
