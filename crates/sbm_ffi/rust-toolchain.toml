# `native_toolchain_rust` wants an exact channel rather than `stable`, so that
# the library shipped in a release is built by a toolchain the version control
# names.
#
# Scoped to this crate rather than the workspace root: `sbm_parser`,
# `sbm_native` and `monitor` are built by cargo directly and have no reason to
# be pinned to whatever the app's build hook happens to need. CI's Rust tests
# and clippy read `channel` from here, though (`analysis.yml`): a lint that
# arrives with a new stable fails a pull request only once this is bumped,
# not on the day rustup ships it.
#
# The one Android target the app ships (arm64-v8a) and the Linux host that
# `flutter test` loads the library on. Never set a default Cargo build target:
# build scripts, proc-macros and host tests must stay host-native.
[toolchain]
channel = "1.98.1"
targets = [
  "aarch64-linux-android",
  "x86_64-unknown-linux-gnu",
]
