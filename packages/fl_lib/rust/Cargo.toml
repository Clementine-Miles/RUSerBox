# LK Cloud, the encrypted sync log and its engine, and their Dart FFI bridge.
#
# Its own workspace root: an app that carries fl_lib inside a Cargo workspace
# of its own (Server Box does) would otherwise have cargo take these crates for
# unlisted members of that one and refuse to build them.
[workspace]
members = ["lkc", "sync", "sync_engine", "ffi"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1

# scrypt opens and seals the sync key file: unoptimized it takes seconds a
# call, which the tests make many of.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
