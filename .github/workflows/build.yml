name: Android release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release from the selected v2.* tag'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  buildAndroid:
    name: Build Android (arm64-v8a)
    # The release key's 1Password token is a secret of environment `release`,
    # which only `v*` tags (created by admins alone) may use.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: true
          persist-credentials: false
      - name: Check LFS files are real
        run: scripts/check-lfs.sh
      - uses: ./.github/actions/setup-rust-pinned
      - uses: ./.github/actions/setup-android-sdk
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4
        with:
          gradle-version: "9.8.0"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Install 1Password CLI
        if: github.ref_type == 'tag'
        uses: 1password/install-cli-action@143a85f84a90555d121cde2ff5872e0f2d7ad8ec # v2
      - name: Build the release APK
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Off a tag there is no release key: sign with the debug key, which
          # is enough to install and test the artifact.
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: ${{ github.ref_type == 'tag' && 'false' || 'true' }}
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: scripts/release/android-signing.sh gradle -p android assembleRelease
      - name: Inspect the APK
        run: scripts/release/inspect-apk.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/RUSerBox_${GITHUB_REF_NAME//\//-}_arm64.apk"
          cp android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip "dist/RUSerBox_${GITHUB_REF_NAME//\//-}_arm64_symbols.zip"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64
          path: dist/

  publishRelease:
    name: Publish the release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.release)
    needs: buildAndroid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-arm64
          path: assets
      - name: Keep the APK and its checksum
        run: |
          rm -f assets/*_symbols.zip
          (cd assets && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
