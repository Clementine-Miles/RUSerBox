name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # File and line in a backtrace without full debuginfo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-pinned
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # OpenSSH for sbm_ssh's end-to-end test, Mesa's lavapipe for the
      # Vulkan render test, a CJK font for the terminal's wide cells.
      - name: Install test services
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y openssh-server mesa-vulkan-drivers fonts-noto-cjk
      - name: Build the Monitor (the app client's end-to-end test runs it)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p server_box_monitor
      - name: Test the workspace
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --no-fail-fast
      - name: Render through Vulkan (lavapipe)
        if: matrix.os == 'ubuntu-latest'
        run: VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json cargo test -p ruserbox --test render_vulkan -- --nocapture
      # The crates with code of their own for Windows.
      - name: Test Windows-specific crates
        if: matrix.os == 'windows-latest'
        run: cargo test -p sbm_parser -p sbm_native -p server_box_monitor --no-fail-fast
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No Dart, Flutter or AI Agent code
        if: matrix.os == 'ubuntu-latest'
        run: |
          ! git ls-files --recurse-submodules | grep -E '\.dart$|pubspec\.(yaml|lock)$|flutter_rust_bridge'

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-pinned
      - uses: ./.github/actions/setup-android-sdk
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4
        with:
          gradle-version: "9.8.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Clippy for aarch64-linux-android
        run: cargo ndk -t arm64-v8a --platform 28 clippy -p ruserbox --lib -- -D warnings
      - name: Widget unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Debug APK
        run: gradle -p android assembleDebug
      - name: Inspect the APK
        run: scripts/release/inspect-apk.sh android/app/build/outputs/apk/debug/app-debug.apk

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install and build
        working-directory: docs
        run: |
          npm ci
          npm run build

  website:
    name: Project website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm run build
