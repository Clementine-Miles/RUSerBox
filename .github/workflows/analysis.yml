# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: flutter analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A new push to a pull request makes the run for the previous one moot.
# Only pull requests: every push to main is a state a release can be cut from,
# and a manual run was asked for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # For the `changes` job's file list. Read-only, and only for this repo.
  pull-requests: read

jobs:
  # Which of the jobs this diff can actually affect.
  #
  # The Rust job costs a cold compile; a docs-only or Dart-only PR need not
  # pay it. The native app builds are not filtered here: they run only on
  # `workflow_dispatch`.
  #
  # Asks GitHub for the file list rather than diffing refs: no checkout, no
  # fetch depth to get wrong, and no merge-base to compute against a base
  # branch that may have moved since. A pull request has one of its own.
  #
  # Anything else — a push to main, a manual run — answers "everything": main is
  # the ref releases are cut from, and narrowing what runs there trades away the
  # wrong thing.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dart: ${{ steps.filter.outputs.dart }}
      android: ${{ steps.filter.outputs.android }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Which filters are answered from the diff: all of them on a pull
          # request, none otherwise.
          strict=' rust dart android '

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            files="$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename')"
          else
            strict=''
            files=''
            echo "not a pull request: running everything"
          fi
          echo "changed files:"
          echo "$files"

          # emit <filter> <pattern> [exclude]: files matching `exclude` are
          # left out before `pattern` is asked.
          emit() {
            if [[ "$strict" != *" $1 "* ]]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              return
            fi
            local covered="$files"
            if [[ -n "${3:-}" ]]; then
              covered="$(grep -vE "$3" <<< "$files" || true)"
            fi
            if grep -qE "$2" <<< "$covered"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::notice::skipping the $1 jobs: nothing they cover changed"
            fi
          }

          # Patterns are grep -E against whole paths. A change to this workflow
          # turns everything on — the filters are the thing under test then —
          # and `packages/` are the submodules the app is built from, so a
          # gitlink move there is a source change to all of it.
          #
          # `.github/actions/` and `build.yml` are here for a reason of the same
          # kind and were missed: `setup-flutter` is the composite action every
          # job below starts with, so a broken SDK pin in it would have been
          # merged with nothing having run it, and `build.yml`
          # does not run on a pull request at all — so its own changes were
          # reaching main with nothing having compiled anything.
          shared='^\.github/(workflows/(analysis|build)\.yml$|actions/)|^pubspec\.(yaml|lock)$|^packages/'

          emit rust "$shared|^crates/|^Cargo\.(toml|lock)$"
          # `crates/` because `flutter test` loads the FFI dylib and the
          # generated bindings come from there.
          #
          emit dart "$shared|^lib/|^test/|^integration_test/|^crates/|^Cargo\.(toml|lock)$|^analysis_options\.yaml$|^assets/|^android/app/src/main/(AndroidManifest\.xml|res/xml/)"
          emit android "$shared|^android/|^scripts/release/patch-jni-build-id\.sh$"

  reproducibilityCheck:
    # These are deterministic-input guards, not a reproducibility proof. The
    # two independent Android builds are compared in android-reproducible.yml.
    name: Build input checks
    # What it reads: Android sources, the pubspec lock (under `dart`'s shared
    # paths) and the JNI patch script.
    needs: changes
    if: needs.changes.outputs.dart == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Check Android split-build reproducibility
        shell: bash
        run: |
          grep_status=0
          git grep -n -F 'BuildConfig.VERSION_CODE' -- android/app/src/main || grep_status=$?
          if [[ "$grep_status" -eq 0 ]]; then
            echo "::error::BuildConfig.VERSION_CODE is ABI-specific for split APKs and must not be compiled into shared Android bytecode."
            exit 1
          elif [[ "$grep_status" -ne 1 ]]; then
            echo "::error::git grep failed with status ${grep_status}."
            exit "$grep_status"
          fi

      - name: Check locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Check JNI build-id patch
        run: scripts/release/patch-jni-build-id.sh

  rustTests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # File and line in a backtrace, without the full debuginfo: that is most
      # of what the linker writes, and linking the test binaries — over forty
      # was most of this job.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-pinned

      # This job's own `cargo` builds into `target/`, so rust-cache applies
      # here, unlike to the build hook (see `build-hook-cache`). After the
      # toolchain step: the key includes the rustc it finds. Saved from main
      # only, so pull requests restore main's and add nothing to the 10 GB.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Rust workspace
        run: cargo test --workspace --no-fail-fast

      # fl_lib's Rust is a workspace of its own, so `--workspace` above does
      # not reach it.
      - name: Test fl_lib's Rust
        run: cargo test --manifest-path packages/fl_lib/rust/Cargo.toml --workspace --no-fail-fast

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path packages/fl_lib/rust/Cargo.toml --workspace --all-targets -- -D warnings

  # The Kotlin side's JVM unit tests (`android/app/src/test`). No device and
  # no Rust: they need the Kotlin sources compiled and nothing else.
  androidUnitTests:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "27"

      - uses: ./.github/actions/setup-flutter

      # `gradlew` is not checked in (`android/.gitignore`): Flutter writes it,
      # and `local.properties` with the SDK's location, on its first build.
      # `--config-only` does that and nothing else.
      - name: Generate the Gradle project
        run: flutter build apk --config-only

      # Without `compileFlutterBuildDebug`, which the Flutter Gradle plugin
      # hangs in front of every variant: it is a whole `flutter assemble` —
      # Dart and the Rust library for each ABI — and was twelve of the job's
      # thirteen minutes, for tests that load neither.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -x :app:compileFlutterBuildDebug

  check:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 1
          submodules: true
          persist-credentials: false
      
      # Restored only: `tests` saves the same SDK and pub cache.
      - uses: ./.github/actions/setup-flutter
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      # `integration_test` too: nothing else in CI reads that directory — the
      # suites in it need a device — so without this a change there is unseen
      # until somebody runs it by hand on one.
      - name: Analyze project source
        run: flutter analyze lib test integration_test

  # Sharded because `flutter test` compiles test files one at a time — its
  # `TestCompiler` is a queue, and concurrency only applies to running them. On
  # one runner that was ~6.5 of the 10 minutes, for ~300 files whose tests took
  # under 5 minutes of CPU between them.
  #
  # By file, and not with `--total-shards`: that slices the tests *inside*
  # every suite (test_core's `_shardSuite`), so each shard still loads and
  # compiles all of them. Tried first; every shard took as long as the whole
  # run had.
  #
  # Not one entrypoint importing every file either — tried: the suites share
  # one isolate, run one after another, and two dozen of them depend on a
  # fresh process.
  tests:
    name: tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter test` builds sbm_ffi through the build hook, and the
      # FFI-dependent suites load that build (`test/helpers/rust_lib_helper.dart`)
      # — no `cargo build` of a second copy here. fl_lib's
      # too, which every test loads from `build/native_assets`
      # (`test/flutter_test_config.dart`).
      - uses: ./.github/actions/build-hook-cache
        with:
          step: restore

      # Every third file, from a sorted list, so the split is stable and a new
      # test file lands in exactly one shard. `git ls-files` rather than a
      # directory walk: only what is checked in, the same set `flutter test`
      # finds on its own, and a pathspec `*` crosses directories.
      #
      # Not the end-to-end suites: they skip without a host to reach, and
      # compiling one costs as much as any other file.
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- 'test/*_test.dart' \
            ':!test/e2e/*' ':!test/*_e2e_test.dart' | sort \
            | awk -v n=3 -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          echo "${#files[@]} test files in this shard"
          flutter test "${files[@]}"

      # From one shard: all three build the same thing.
      - if: matrix.shard == 0
        uses: ./.github/actions/build-hook-cache
        with:
          step: save

      - if: matrix.shard == 0
        uses: ./.github/actions/setup-flutter
        with:
          cache: true
          step: save
