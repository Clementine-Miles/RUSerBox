name: Android reproducibility

# Builds the unsigned release APK twice, from source directories of different
# path lengths, and requires them byte-identical: F-Droid rebuilds from this
# source and compares against the published APK. Weekly on main, and by hand
# before a tag that touches android/, the build scripts or the toolchains.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.dir }}
    strategy:
      matrix:
        dir: [a, a-much-longer-source-directory-name]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_DATE_EPOCH: "1767225600"
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ matrix.dir }}
          lfs: true
          submodules: true
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        working-directory: ${{ matrix.dir }}
        run: rustup show
      - uses: ./${{ matrix.dir }}/.github/actions/setup-android-sdk
        with:
          directory: ${{ matrix.dir }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4
        with:
          gradle-version: "9.8.0"
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Build the unsigned APK
        working-directory: ${{ matrix.dir }}
        env:
          # The source path out of the Rust library.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}/${{ matrix.dir }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo
        run: gradle -p android assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-${{ matrix.dir }}
          path: ${{ matrix.dir }}/android/app/build/outputs/apk/release/app-release-unsigned.apk

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: apks
      - run: scripts/release/compare-apks.sh apks/apk-a/app-release-unsigned.apk apks/apk-a-much-longer-source-directory-name/app-release-unsigned.apk
