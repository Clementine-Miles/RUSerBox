name: Install the pinned Rust toolchain
description: >-
  The toolchain rust-toolchain.toml pins (with its components and targets),
  rather than the runner's `stable`, which moves on its own.
runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        v="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
        test -n "$v" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
        rustup show
        echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
