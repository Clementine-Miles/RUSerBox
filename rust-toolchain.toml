# An exact toolchain rather than `stable`: the Android library a release
# ships, and the lints CI enforces, change only when this is bumped.
# aarch64-linux-android is the app's only Android target; the host target
# builds the Monitor, the tests and the desktop development window.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["aarch64-linux-android", "x86_64-unknown-linux-gnu"]
