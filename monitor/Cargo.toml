[package]
name = "server_box_monitor"
version = "0.4.0"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Shared status parser (monorepo-wide)
sbm_parser = { path = "../crates/sbm_parser" }
sbm_redfish = { path = "../crates/sbm_redfish" }
sbm_virt = { path = "../crates/sbm_virt" }
fl_lkc = { path = "../packages/fl_lib/rust/lkc" }
# Native (syscall/procfs) status sampling for monitor's own local collection
# path (never used by the SSH-based app) — see monitoring.rs::collect_metrics
sbm_native = { path = "../crates/sbm_native" }

# Web framework
ntex = { version = "4", features = ["tokio", "rustls"] }
ntex-ratelimiter = "0.5"

# TLS (ring instead of aws-lc: no cmake/assembly dependency for static musl builds)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
# rust_crypto instead of aws_lc_rs: pure Rust, no cmake/assembly dependency for static musl builds
bcrypt = "0.19"
# sha2 0.11 returns a `hybrid_array::Array`, which has no `LowerHex` — hence hex
sha2 = "0.11"
zeroize = "1.9"

# Settings backups (`agent_backup`): age encryption, and WebDAV listings
# read with the XML parser `sbm_parser` already uses.
age = { version = "0.11", features = ["armor"] }
roxmltree = "0.21"

tar = { version = "0.4", default-features = false }
flate2 = "1"
ring = "0.17"
base64 = "0.22"
hex = "0.4"

# Configuration
dotenvy = "0.15"

# Random credential generation (JWT secret / initial admin password) and no-echo password input
getrandom = "0.4"
rpassword = "7"

# HTTP client for push notifications
# rustls instead of native-tls: consistent with sqlx, static musl builds without OpenSSL.
#
# `rustls-no-provider` and not `rustls`, which is defined as
# `__rustls-aws-lc-rs` and pulls aws-lc-sys — a second, complete crypto
# implementation beside the `ring` everything else here uses, and a cmake
# build script in front of the musl targets. The provider it no longer brings
# is installed once in `monitoring::push::http_client`; without that, building
# the client panics inside reqwest rather than failing as a push error, which
# `monitoring::push`'s webhook tests hold.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2", "stream"] }

# Local PTY for the terminal (ConPTY on Windows, forkpty elsewhere).
portable-pty = "0.9"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration validation
regex = "1.13"

# URL encoding
percent-encoding = "2.3"
# Bark's encrypted push (AES-CBC); the versions already in the lockfile.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# get_server_name() falls back to the real OS hostname (see config.rs)
hostname = "0.4.2"
async-stream = "0.3.6"
futures = "0.3.34"
url = "2"
# Advisory process-wide lock for custom-command directory replacements.
fs2 = "0.4"

# Reading the user's login shell out of the passwd database. `$SHELL` is no
# substitute for a service: it reports whatever launched the agent, not what
# the user configured.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A command's process tree as a job object (`utils::job`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
ntex = { version = "4", features = ["no-test-logging"] }
tempfile = "3.27.0"
# TLS servers and self-signed certificates for integration tests.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Paused time, for what waits minutes (the sudo password's 15).
tokio = { version = "1.53", features = ["full", "test-util"] }
