plugins {
    id "com.android.application"
}

// Release signing comes from the environment (`scripts/release/android-signing.sh`
// sets SBX_*); a local check can sign with the debug key explicitly.
def releaseStoreFilePath = System.getenv('SBX_KEYSTORE')?.trim()
def releaseStorePassword = System.getenv('SBX_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SBX_KEY_ALIAS')?.trim()
def releaseKeyPassword = System.getenv('SBX_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFilePath && file(releaseStoreFilePath).exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def allowDebugReleaseSigning = project.findProperty('allowDebugReleaseSigning') == 'true'

def repoRoot = rootProject.file('..')
def rustOut = layout.buildDirectory.dir("rustJniLibs")

android {
    namespace "tech.lolli.toolbox"
    compileSdk rootProject.file('compile-sdk-version.txt').text.trim().toInteger()
    buildToolsVersion rootProject.file('build-tools-version.txt').text.trim()
    ndkVersion rootProject.file('ndk-version.txt').text.trim()

    defaultConfig {
        applicationId "tech.lolli.toolbox"
        // Vulkan 1.1 is required from Android 9 (API 28) on devices that ship it.
        minSdk 28
        targetSdk 36
        // Above the last Flutter release's 192503 (build 1925, arm64 = 3), so
        // this installs over it and keeps its data.
        versionCode rootProject.file('version-code.txt').text.trim().toInteger()
        versionName "2.0.0"
        ndk {
            // The only ABI: aarch64-linux-android.
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            jniLibs.srcDirs += rustOut.get().asFile
        }
        test.java.srcDirs += 'src/test/kotlin'
    }

    packaging {
        jniLibs {
            // Stored uncompressed and page-aligned (16 KiB), mapped in place.
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // GameActivity's Java half; android-activity 0.6 builds the native half.
    implementation 'androidx.games:games-activity:4.4.0'
    // BundleCompat, for the widget configuration screen.
    implementation 'androidx.core:core:1.17.0'
    // GameActivity is an AppCompatActivity.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

// The Rust library, built for arm64-v8a with the NDK pinned above.
def cargoTask = tasks.register('cargoBuild', Exec) {
    def release = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    workingDir repoRoot
    def args = ['cargo', 'ndk', '-t', 'arm64-v8a', '--platform', '28', '-o', rustOut.get().asFile.absolutePath, 'build', '-p', 'ruserbox', '--lib']
    if (release) args += ['--profile', 'release-app']
    commandLine args
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    inputs.dir(new File(repoRoot, 'app/src'))
    inputs.dir(new File(repoRoot, 'crates'))
    inputs.file(new File(repoRoot, 'Cargo.lock'))
    outputs.dir(rustOut)
}
tasks.named('preBuild') { dependsOn cargoTask }
