# ServerBox monorepo Rust workspace
# - crates/sbm_parser: shared status parser (used by both monitor and the app via FFI)
# - crates/sbm_native: native (syscall/procfs) status sampling for monitor's local
#                       collection path only — never used by the SSH-based app
# - crates/sbm_redfish: Redfish (BMC) client shared by monitor and the app
# - crates/sbm_virt:   virtualization (libvirt command layer) shared by monitor and the app
# - monitor:           headless server-side monitoring and HTTP API
[workspace]
resolver = "2"
members = ["crates/sbm_parser", "crates/sbm_store", "crates/sbm_ssh", "crates/sbm_monitor_client", "app", "crates/sbm_native", "crates/sbm_redfish", "crates/sbm_virt", "crates/sbm_ffi", "monitor"]
exclude = ["third_party/ironrdp", ".pub-cache"]

# Debug builds keep line tables only: the monitor alone links ~40 test
# binaries, and full debug info made `target/` tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Smaller release binaries for the shipped container / native packages
strip = true

# A proc-macro is a dylib the compiler dlopens while it is building, not
# something that ships — so stripping one buys nothing, and on macOS 26+ it
# costs the build outright. `strip` above otherwise applies to them too, and
# the stripped result is rejected by the loader:
#
#   error: .../libsqlx_macros-<hash>.dylib: dlopen(...): tried:
#     '...' (mis-aligned LINKEDIT string pool, fileOffset=0x005B195C)
#   error: could not compile `sqlx` (lib) due to 1 previous error
#
# Which makes `cargo build --release -p server_box_monitor` — and every
# profile inheriting this one, `release-monitor` included — fail on a
# developer machine while CI, on older linkers, goes on passing. Build
# scripts are in the same override and equally not shipped.
[profile.release.build-override]
strip = false

# The app's Android library (`android/app/build.gradle` builds with it).
# Not stripped here: Gradle's `debugSymbolLevel` keeps the symbol table for
# native crash reports and strips the library on its way into the APK. Thin
# LTO keeps the library small without a quarter-hour fat link.
[profile.release-app]
inherits = "release"
strip = false
lto = "thin"

# The agent's own release profile, used by `monitor-release.yml` and by
# `monitor/Dockerfile`, and by nothing the app builds.
#
# `lto` and `codegen-units` are profile-wide — `[profile.release.package.*]`
# accepts neither — so setting them above would put a fat-LTO link in front of
# every app build, for a binary no app ships. Here they cost only the agent's
# release, which is built by hand a few times a release. Measured on the
# agent: 20.1 MB → 15.2 MB, at +1 minute.
#
# `opt-level` is deliberately left at the inherited 3. `"s"` takes it to
# 11.2 MB, and this is the process that samples the machine and terminates
# every TLS connection to it; that trade is not one a build profile should
# make silently.
#
# `monitor/Dockerfile` builds the crate *outside* this workspace — it rewrites
# the `sbm_parser` path so `monitor/Cargo.toml` becomes the root — so nothing
# in this file reaches it, `[profile.release]` above included. It passes the
# same settings as `CARGO_PROFILE_RELEASE_*` and says so there.
[profile.release-monitor]
inherits = "release"
lto = "fat"
codegen-units = 1

# The agent built to deploy to a test machine while developing: the release
# profile's optimisation without `release-monitor`'s fat LTO, and incremental,
# so a change to the agent alone relinks in minutes rather than the quarter of
# an hour the fat link takes there. Never shipped, never measured for size.
[profile.monitor-test]
inherits = "release"
incremental = true
