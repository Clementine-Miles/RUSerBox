# RUSerBox Rust workspace (the Android app's native code, built by hook/build.dart)
# - crates/sbm_parser: server command manifest, scripts and output parsers
# - crates/sbm_redfish: Redfish (BMC) client
# - crates/sbm_virt:   virtualization (libvirt command layer, PVE API client)
# - crates/sbm_ffi:    flutter_rust_bridge binding layer
[workspace]
resolver = "2"
members = ["crates/sbm_parser", "crates/sbm_redfish", "crates/sbm_virt", "crates/sbm_ffi"]
exclude = [".pub-cache"]

[profile.release]
strip = true

# Proc-macros and build scripts run on the build host and never ship;
# stripping them gains nothing and has broken loaders on some hosts.
[profile.release.build-override]
strip = false

# `sbm_ffi` keeps its symbols: Gradle's `debugSymbolLevel 'SYMBOL_TABLE'`
# (android/app/build.gradle) extracts them into the native debug symbols
# archive and strips the library on its way into the APK, so the shipped .so
# is no larger while native crash tombstones stay resolvable.
[profile.release.package.sbm_ffi]
strip = false
